name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Syntax-check every source file
        run: |
          fails=0
          for f in $(git ls-files 'src/**/*.js' 'tests/*.js'); do
            node --check "$f" || fails=$((fails+1))
          done
          [ "$fails" -eq 0 ] && echo "all files OK" || exit 1
